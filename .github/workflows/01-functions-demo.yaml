name: testing-workflow-dispatch
on:
  workflow_dispatch:
jobs:
  release-job:
    runs-on: ubuntu-latest
    steps:
      - name: naming the version
        id: version
        run: |
          echo "image_tag=v1.0.0" >> $GITHUB_OUTPUT

      - name: using the version
        run: echo ${{ steps.version.outputs.image_tag }}
  
  deploy-job:
    runs-on: ubuntu-latest
    steps:
      - name: deployment_url
        id: url
        run: |
          echo "deployment_url=http://leardevcloud.shop:8080" >> $GITHUB_OUTPUT

    outputs:
      deployment_url: ${{ steps.url.outputs.deployment_url }}
  
  notify-job:
    runs-on: ubuntu-latest
    needs:
      - deploy-job
    steps:
      - name: notification
        run: |
          echo "sending notification"
          echo "deployment url is ${{ needs.deploy-job.outputs.deployment_url }}"