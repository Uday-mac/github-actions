name: vprofile-CI-CD
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:

  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses:  actions/checkout@v5

      - name: maven-build
        run: mvn install

      - name: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: vprofile-app
          path: target/*.war

  security-scan:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v5

      - name: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: .
          exit-code: 0
          format: 'json'
          output: 'trivy-results.json'
          vuln-type: 'os,library'
          severity: HIGH,CRITICAL

      - name: upload-scan-results
        uses: actions/upload-artifact@v7
        with:
          name: vprofile-trivy-scan-reports
          path: trivy-results.json

  Testing:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: code-checkout
        uses: actions/checkout@v5

      - name: maven-test
        run: mvn test

      - name: maven-checkstyle
        run: mvn checkstyle:checkstyle
  
  docker:
    env:
      REPO_URL: "821643762246.dkr.ecr.us-east-1.amazonaws.com/"
      IMAGE_TAG: "githubaction/vprofile"
      VERSION: "${{ github.run_number }}"
      
    runs-on: ubuntu-latest
    steps:
      - name: code-checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build-docker-image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ${{ env.REPO_URL}}${{ env.IMAGE_TAG }}:latest
            ${{ env.REPO_URL}}${{ env.IMAGE_TAG }}:${{ env.VERSION }}

      - name: running-container
        run: |
          docker images
          docker run -d -p 8080:8080 --name vprofile-container ${{ env.REPO_URL}}${{ env.IMAGE_TAG }}:${{ env.VERSION }}

      - name: smoke-test
        run: |
          sleep 15
          curl http://localhost:8080
        
