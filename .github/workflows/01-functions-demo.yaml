name: vprofile-CI-CD
on:
  workflow_dispatch:
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses:  actions/checkout@v5

      - name: maven-build
        run: mvn install

  Testing:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: code-checkout
        uses: actions/checkout@v5

      - name: maven-test
        run: mvn test

      - name: maven-checkstyle
        run: mvn checkstyle:checkstyle