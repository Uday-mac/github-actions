name: environment-demo
on:
  workflow_dispatch:
env:
  APPLICATION_NAME: gitactions
  VERSION: v1.0.1
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v5

      - name: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME}}/${{ env.APPLICATION_NAME}}:${{ env.VERSION }}

      - name: run-container
        run: |
          docker run -d -p 5000:5000 --name test-app ${{ vars.DOCKERHUB_USERNAME}}/${{ env.APPLICATION_NAME}}:${{ env.VERSION }}

      - name: smoke-test
        run: |
          sleep 5
          curl -f http://localhost:5000

      - name: push-image
        if: sucess()
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME}}/${{ env.APPLICATION_NAME}}:${{ env.VERSION }}
  dev-deploy:
    needs: build-job
    runs-on: ubuntu-latest
    environment: dev

    steps: 
      - name: testing-env
        
      