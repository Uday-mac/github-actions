name: angular-cicd
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v5

      - name: nodee-version
        uses: actions/setup-node@v7
        with:
           node-version: '24'
          
      - name: install-dependenices
        run: npm install 

      - name: build-package
        run: npm run build -- --configuration production

      - name: running-app
        run: npx serve -s

      - name: checking-app
        run: curl http://localhost:4200
