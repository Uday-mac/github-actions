name: cache-demo
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v3

      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: restore cache
        uses: actions/cache@v6
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: cache hit
        run: |
          echo "Cache hit: ${{ steps.pip-cache.outputs.cache-hit }}"

      - name: install dependencies
        run: |
          pip install -r requirements.txt

  test-job:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v3

      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: restore cache
        uses: actions/cache@v6
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: cache hit
        run: |
          echo "Cache hit: ${{ steps.pip-cache.outputs.cache-hit }}"

      - name: install dependencies
        run: |
          pip install -r requirements.txt
          
