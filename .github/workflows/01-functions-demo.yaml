name: artifact-ddemo
on:
  workflow_dispatch:
jobs:
  flask-ci-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: udaydevmac/gitactions:v1.0.1

      - name: running the application
        run: |
          docker run -d -p 5000:5000 --name python-app udaydevmac/gitactions:v1.0.1
      
      - name: checking if the container is running
        if: always()
        run: |
          docker ps
          docker ps -a

      - name: perform-generate-smoke-reports
        run: |
          sleep 10
          curl -f http://localhost:5000 > smoke-test-report.txt
          curl -f http://localhost:5000/health > health-test-report.txt

      - name: container logs
        run: docker logs udaydevmac/gitactions:v1.0.1 > logs-report.txt

      - name: push image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: udaydevmac/gitactions:v1.0.1

      - name: upload the reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            smoke-test-report.txt
            health-test-report.txt
            logs-report.txt
  review-job:
    needs: flask-ci-job
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: downloaded-reports

      - name: print the reports
        run: |
          echo "========smoke-test============"
          cat downloaded-reports/smoke-test-report.txt
          echo "=========health============"
          cat downloaded-reports/health-test-report.txt
          echo "=========logs============"
          cat downloaded-reports/logs-report.txt
