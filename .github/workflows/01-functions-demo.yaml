name: Flask build test publish workflow

on:
  push:
    branches:
      - main

    paths:
      - app.**
      - .github/workflows/**
    
  pull_request:

    branches:
      - main

    types: 
      - opened
      - synchronize

env:
  APPLICATION_NAME: gitactions    
     
jobs:
  python-flask-build-test:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name = 'push' && startsWith(github.ref_name, 'main')) || (github.event_name = 'pull_request' &&  github.base_ref = 'main' && !contains(github.event.pull_request.title, 'WIP')) }}

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: generating dynamic tag
        run: echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: login into docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}
          
      - name: running the container
        run: |
          docker run -d -p 5000:5000 --name test-flask ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: push docker image
        if: ${{ successs() }}
        run: |
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: Collect container logs
        if: ${{ failure() }}
        run: |
          docker logs test-flask

      - name: clean up
        if: ${{ always() }}
        run: |
          docker rm -f test-flask
