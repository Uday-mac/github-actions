name: testing-workflow-dispatch
on:
  workflow_dispatch:
jobs:
  release-job:
    runs-on: ubuntu-latest
    steps:
      - name: naming the version
        id: version
        run: |
          echo "image_tag=v1.0.0" >> $GITHUB_OUTPUT

      - name: using the version
        run: echo ${{ steps.version.outputs.image_tag }}